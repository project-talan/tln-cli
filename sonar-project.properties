sonar.projectKey=project-talan_tln-cli
sonar.organization=project-talan

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=tln-cli
sonar.projectVersion=2.0.0-alpha

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# v2 TypeScript rewrite lives under src/, compiled to dist/ via tsc (see package.json).
# old/ holds the legacy v1 JS implementation kept for reference and isn't part of the
# published package (package.json "files": ["dist"]), so it's excluded from analysis.
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/old/**,**/*.test.ts

# Tests are colocated with sources as *.test.ts (Vitest, see vitest.config.ts).
sonar.tests=src
sonar.test.inclusions=**/*.test.ts

# Generated by `npm run test:coverage` (vitest --coverage, v8 provider, lcov reporter).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
